server {
    listen 80;
    server_name localhost;

    # Set root to the folder where files are located
    root /usr/share/nginx/html;
    index index.html;

    location /app/ {
        # This points /app/ requests to the files in /usr/share/nginx/html/app/
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
    }

    # Redirect root to /app/
    location = / {
        return 301 /app/;
    }
}
