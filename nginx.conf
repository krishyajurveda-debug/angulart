server {
    listen 80;
    server_name localhost;

    # Handle the /app/ route
    location /app/ {
        alias /usr/share/nginx/html/app/;
        index index.html;
        # Try the file, then directory, then fall back to the absolute index.html
        try_files $uri $uri/ /app/index.html;
    }

    # Redirect root to /app/
    location / {
        return 301 /app/;
    }
}
