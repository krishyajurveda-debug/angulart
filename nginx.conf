server {
    listen 80;
    server_name localhost;

    # Serve the app at /app/
    location /app/ {
        alias /usr/share/nginx/html/app/;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # Redirect root to /app/
    location / {
        return 301 /app/;
    }
}
