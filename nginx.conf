server {
    listen 80;
    
    # This matches the location where we copied your files
    location / {
        root /usr/share/nginx/html;
        # If accessing /app/, point to the subfolder
        location /app/ {
            try_files $uri $uri/ /app/index.html;
        }
        # Redirect root if needed
        return 301 /app/;
    }
}
