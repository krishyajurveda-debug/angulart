server {
    listen 80;
    server_name localhost;

    # Map the root of the server
    root /usr/share/nginx/html;

    location /app/ {
        # Ensure the index is explicitly defined
        index index.html;
        
        # If the file exists, serve it; otherwise, return index.html
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        return 301 /app/;
    }
}
