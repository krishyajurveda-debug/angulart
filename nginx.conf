server {
    listen 80;
    server_name localhost;

    # Map the root to your subfolder
    location /app/ {
        alias /usr/share/nginx/html/app/;
        index index.html;
        # Try to find the file; if not, return index.html for Angular routing
        try_files $uri $uri/ /app/index.html;
    }

    # Optional: Redirect root to your /app/ path
    location / {
        return 301 /app/;
    }
}
