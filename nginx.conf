server {
    listen 80;
    server_name localhost;

    location /app/ {
        alias /usr/share/nginx/html/app/;
        
        # This tells Nginx exactly which file to serve for the directory
        index index.html;
        
        # If the file/path doesn't exist, serve /app/index.html
        # The key is to make sure this doesn't trigger a recursive loop
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        return 301 /app/;
    }
}
