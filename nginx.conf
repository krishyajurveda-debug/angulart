server {
    listen 80;
    server_name localhost;

    # Set the root to the main HTML directory
    root /usr/share/nginx/html;

    # Redirect root to /app/
    location = / {
        return 301 /app/;
    }

    # Handle /app/ requests
    location /app/ {
        # This points to the physical directory: /usr/share/nginx/html/app/
        # We use 'alias' here to map /app/ directly to our folder
        alias /usr/share/nginx/html/app/;
        
        index index.html;
        
        # If the file exists, serve it; otherwise, serve index.html
        try_files $uri $uri/ /app/index.html;
    }
}
