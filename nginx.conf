events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # Frontend SPA
        location /app/ {
            alias /usr/share/nginx/html/app/;
            try_files $uri $uri/ /app/index.html;
        }

        location = / {
            return 301 /app/;
        }

        # GraphQL Proxy
        location /graphql {
            proxy_pass https://springtoo.onrender.com;
            proxy_set_header Host springtoo.onrender.com;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Accept Terms Proxy
        location /accept-terms/ {
            proxy_pass https://springtoo.onrender.com;
            proxy_set_header Host springtoo.onrender.com;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https://springtoo.onrender.com;" always;
        }
    }
}
