# Standard Nginx configuration block
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name localhost;

        # Set root to the folder where files are located
        root /usr/share/nginx/html;
        index index.html;

        # 1. Frontend SPA Routing
        # This handles your Angular app at /app/
        location /app/ {
            alias /usr/share/nginx/html/app/;
            try_files $uri $uri/ /app/index.html;
        }

        # Redirect root to /app/
        location = / {
            return 301 /app/;
        }

        # 2. GraphQL Proxy
        location /graphql/ {
            proxy_pass http://127.0.0.1:8090/graphql/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Accept Terms Proxy
        location /accept-terms {
            proxy_pass http://127.0.0.1:8090/accept-terms;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            # Hardcoded CSP to avoid "unknown variable" errors
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self' https://springtoo.onrender.com;" always;
        }
    }
}
