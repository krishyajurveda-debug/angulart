events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Optimized buffers for GraphQL/POST requests
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ADD THESE: Global timeouts to prevent EOFException
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        location /app/ {
            alias /usr/share/nginx/html/app/;
            try_files $uri $uri/ /app/index.html;
        }

        location = / {
            return 301 /app/;
        }

        # REFACTORED: Use a single upstream block or shared configuration 
        # to avoid repeating headers for every location
        location ~ ^/(graphql|accept-terms) {
            proxy_pass http://springtoo.onrender.com;
            
            # Use HTTP 1.1
            proxy_http_version 1.1;
            
            # Clear connection header for upstream
            proxy_set_header Connection "";
            
            # Host header must match the backend domain
            proxy_set_header Host springtoo.onrender.com;
            
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Critical for preventing EOF errors on POST requests
            proxy_request_buffering on;
        }
    }
}
