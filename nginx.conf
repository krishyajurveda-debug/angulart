server {
    listen 80;
    server_name localhost;

    # 1. The location MUST match your base-href (/app/)
    location /app/ {
        # 2. Use 'alias' to map the URL to the physical folder on disk
        alias /usr/share/nginx/html/app/;
        
        # 3. Explicitly tell Nginx to look for index.html (fixes 403 Directory Listing)
        index index.html;
        
        # 4. Fallback to index.html so Angular router can handle the route
        try_files $uri $uri/ /app/index.html;
    }
}
