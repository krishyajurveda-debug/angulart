server {
    listen 80;
    server_name localhost;

    location /app/ {
        alias /usr/share/nginx/html/app/;
        # This directive prevents the 403 Forbidden directory listing error
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        return 301 /app/;
    }
}
