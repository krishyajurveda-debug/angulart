server {
    listen 80;
    server_name localhost;

    # Map requests to the physical directory
    root /usr/share/nginx/html/app;

    location /app/ {
        # Serve index.html if the request is for /app/
        try_files $uri $uri/ /index.html;
    }

    # Redirect root to /app/
    location / {
        return 301 /app/;
    }
}
