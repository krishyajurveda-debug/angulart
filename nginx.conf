server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Handle the /app/ route
    location /app/ {
        # This tells Nginx to look for files in /usr/share/nginx/html/app/
        alias /usr/share/nginx/html/;
        # SPA support: if the file doesn't exist, return /app/index.html
        try_files $uri $uri/ /index.html;
    }
    
    # Optional: Redirect root to /app/
    location = / {
        return 301 /app/;
    }
}
