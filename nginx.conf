server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;

    location /app/ {
        # This forces Nginx to look for index.html at this specific path
        try_files $uri $uri/ /app/index.html =404;
    }

    # Redirect root to /app/
    location / {
        return 301 /app/;
    }
}
