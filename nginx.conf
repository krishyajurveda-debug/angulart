server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 1. Frontend SPA Routing
    location /app/ {
        alias /usr/share/nginx/html/app/;
        try_files $uri $uri/ /app/index.html;
    }

    location = / {
        return 301 /app/;
    }

    # 2. GraphQL Proxy
    location /graphql {
        proxy_pass http://127.0.0.1:8090/graphql;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Accept Terms Proxy
    location /accept-terms/ {
        proxy_pass http://127.0.0.1:8090/accept-terms/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Ensure $csp_policy is defined in your nginx.conf http context
        add_header Content-Security-Policy $csp_policy always;
    }
}
